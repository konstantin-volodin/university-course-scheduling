name: Solver checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: solver

jobs:
  check:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: solver/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint, types, and tests
        run: make check
      - name: Validate public instances
        run: |
          for instance in tiny medium telfer; do
            uv run --locked scheduler solve "../instances/$instance" --check
          done
      - name: Generate example reports
        run: uv run --locked scheduler solve ../instances/tiny --time-limit 30 -o ci-results/result.json
      - name: Upload example reports
        uses: actions/upload-artifact@v7
        with:
          name: tiny-reports-python-3.14
          path: |
            solver/ci-results/result.json
            solver/ci-results/schedule.html
            solver/ci-results/instance.html
          if-no-files-found: error
          retention-days: 7
